<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | My Bookshelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">
      <h1 class="logo auth-logo">My Bookshelf</h1>
      <h2 class="auth-title">ログイン</h2>

      <form id="loginForm" class="auth-form">
        <label class="field-label" for="loginEmail">メールアドレス</label>
        <input type="email" id="loginEmail" autocomplete="email" required>

        <label class="field-label" for="loginPassword">パスワード</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>

        <p class="auth-error" id="loginError" hidden></p>

        <button type="submit" class="btn-primary" id="loginSubmit">ログイン</button>
      </form>

      <p class="auth-switch">
        アカウントをお持ちでない方は
        <a href="signup.html">こちら</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { loginUser, redirectIfLoggedIn } from './auth.js';

    redirectIfLoggedIn();

    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const submitBtn = document.getElementById('loginSubmit');

    if (new URLSearchParams(window.location.search).get('created') === '1') {
      errorEl.textContent = 'アカウントを作成しました。ログインしてください。';
      errorEl.classList.add('auth-success');
      errorEl.hidden = false;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      errorEl.classList.remove('auth-success');
      submitBtn.disabled = true;
      submitBtn.textContent = 'ログイン中…';

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        await loginUser(email, password);
        window.location.href = 'index.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = 'ログイン';
      }
    });
  </script>
</body>
</html>
