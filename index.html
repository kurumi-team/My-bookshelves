<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookshelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="authGate" class="auth-gate"><p>確認中…</p></div>

  <!-- ===== ヘッダー ===== -->
  <header class="app-header">
    <h1 class="logo">My Bookshelf</h1>
    <nav class="lang-switch" id="langSwitch" aria-label="Language">
      <button class="lang-btn" data-lang="ja">JA</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="vi">VI</button>
    </nav>
    <button class="btn-logout" id="logoutBtn">ログアウト</button>
    <button class="btn-add" id="openSearchBtn" data-i18n="addBook" aria-label="本を登録する">＋ 本を登録</button>
  </header>

    <!-- ===== ホーム画面 ===== -->
  <section class="home-dashboard" id="homeDashboard" >
    <h2 data-i18n="yourBookshelf">あなたの本棚</h2>

    <div class="shelf-summary">
      <button class="summary-card" data-open-shelf="unread">
        <span data-i18n="tabUnread">Unread</span>
        <strong id="unreadCount">0冊</strong>
      </button>

      <button class="summary-card" data-open-shelf="reading">
        <span data-i18n="tabReading">Reading</span>
        <strong id="readingCount">0冊</strong>
      </button>

      <button class="summary-card" data-open-shelf="finished">
        <span data-i18n="tabFinished">Finished</span>
        <strong id="finishedCount">0冊</strong>
      </button>
    </div>

    <div class="recent-books">
      <h3 data-i18n="recentBooks">最近読んだ本</h3>
      <ul id="recentBooksList"></ul>
      <p id="noRecentBooks" data-i18n="noRecentBooks">まだ読み終えた本はありません。</p>
    </div>
  </section>

<!-- ===== ホームに戻る ===== -->
<button class="btn-home" id="backHomeBtn" data-i18n="backHome" hidden>ホームに戻る</button>

  <!-- ===== 棚タブ ===== -->
  <nav class="shelf-tabs" id="shelfTabs" hidden> 
    <button class="tab is-active" data-status="unread" data-i18n="tabUnread">Unread</button>
    <button class="tab" data-status="reading" data-i18n="tabReading">Reading</button>
    <button class="tab" data-status="finished" data-i18n="tabFinished">Finished</button>
  </nav>

  <!-- ===== 本棚 ===== -->
  <main class="shelf" id="shelf" aria-live="polite" hidden>
    <!-- 本の背表紙はJSで挿入 -->
  </main>

  <p class="empty-state" id="emptyState" data-i18n="emptyState" hidden>
    この棚にはまだ本がありません。「＋ 本を登録」から追加してみましょう。
  </p>

  <!-- ===== 検索パネル ===== -->
  <section class="panel" id="searchPanel" hidden>
    <div class="panel-inner">
      <button class="btn-close" data-close-panel data-i18n="close">閉じる</button>
      <h2 class="panel-title" data-i18n="searchTitle">本を検索</h2>
      <form id="searchForm" class="search-form">
        <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="タイトルや著者名で検索" autocomplete="off">
        <button type="submit" data-i18n="searchButton">検索</button>
      </form>
      <p class="hint" id="searchHint" data-i18n="searchHintDefault">読みたい本のタイトルを入力してください。</p>
      <ul class="search-results" id="searchResults"></ul>
    </div>
  </section>

  <!-- ===== 本の詳細パネル ===== -->
  <section class="panel" id="detailPanel" hidden>
    <div class="panel-inner">
      <button class="btn-close" data-close-panel data-i18n="close">閉じる</button>
      <div class="detail-book">
        <img class="detail-cover" id="detailCover" alt="">
        <div class="detail-meta">
          <h2 class="detail-title" id="detailTitle"></h2>
          <p class="detail-author" id="detailAuthor"></p>
          <p class="detail-date" id="detailDate"></p>
        </div>
      </div>

      <div class="detail-actions" id="detailActions">
        <button class="btn-status" data-set-status="reading" data-i18n="startReading">読み始める</button>
        <button class="btn-status" data-set-status="finished" data-i18n="finishReading">読み終えた</button>
      </div>

      <button class="btn-primary" id="leaveImpressionBtn" data-i18n="leaveImpression">感想を残す</button>

　　　　<button class="btn-delete" id="deleteBookBtn" data-i18n="deleteBook">本棚から削除</button>


      <div class="impressions-block">
        <h3 data-i18n="pastImpressions">これまでの感想</h3>
        <ul class="impression-list" id="impressionList"></ul>
        <p class="hint" id="noImpressionHint" data-i18n="noImpressions">まだ感想が記録されていません。</p>
      </div>
    </div>
  </section>

  <!-- ===== 感想記録パネル（星→3段階の分岐質問） ===== -->
  <section class="panel" id="impressionPanel" hidden>
    <div class="panel-inner">
      <button class="btn-close" data-close-panel data-i18n="close">閉じる</button>
      <h2 class="panel-title" id="impressionPanelTitle" data-i18n="recordImpression">感想を記録</h2>

      <p class="field-label" data-i18n="rateStars">星をつける</p>
      <div class="star-picker" id="starPicker">
        <button class="star" data-value="1">★</button>
        <button class="star" data-value="2">★</button>
        <button class="star" data-value="3">★</button>
        <button class="star" data-value="4">★</button>
        <button class="star" data-value="5">★</button>
      </div>

      <div class="step-block" id="q1Block">
        <p class="field-label" data-i18n="q1Prompt">今の気持ちに近いものは？</p>
        <div class="tag-picker" id="q1Picker">
          <!-- 6つの選択肢はi18n.jsのツリーからJSで動的に挿入する -->
        </div>
      </div>

      <!-- Q2・Q3はJSが選択に応じて動的に挿入する -->
      <div id="q2Block"></div>
      <div id="q3Block"></div>

      <div class="step-block" id="freeTextBlock" hidden>
        <p class="field-label" data-i18n="freeTextLabel">自由記述（任意・50文字まで）</p>
        <textarea id="freeTextInput" maxlength="50" rows="3" data-i18n-placeholder="freeTextPlaceholder" placeholder="もう少しだけ言葉にしておきたいことがあれば"></textarea>
        <p class="char-counter"><span id="freeTextCount">0</span> / 50</p>
      </div>

      <button class="btn-primary" id="saveImpressionBtn" data-i18n="saveImpression" disabled>感想を保存</button>
    </div>
  </section>

  <script src="i18n.js"></script>
  <script type="module">
    import { requireAuth, logoutUser } from './auth.js';
    import { initApp } from './script.js';

    (async () => {
      try {
        const user = await requireAuth();
        if (user) {
          await initApp(user.uid);
          document.getElementById('authGate').remove();
        }
        // 未ログインの場合はrequireAuth内でlogin.htmlへ移動するため、
        // ここでは何もしない（画面遷移が終わるまでauthGateで隠したままにする）
      } catch (err) {
        console.error('アプリの初期化に失敗しました:', err);
        const gate = document.getElementById('authGate');
        gate.innerHTML = `
          <div style="text-align:center; padding: 0 24px;">
            <p>読み込みに失敗しました。</p>
            <p style="font-size: 0.8rem; color: #8C3B34; margin-top: 8px;">${err.message || err}</p>
            <button onclick="location.reload()" style="margin-top: 16px; padding: 8px 16px; border-radius: 4px; border: 1px solid #D9CFB7; background: #fff; cursor: pointer;">再読み込み</button>
          </div>
        `;
      }
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await logoutUser();
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
